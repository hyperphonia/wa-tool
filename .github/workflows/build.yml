name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            artifact: WA-Tool-Windows-x64
            arch: '-A x64'
          - os: macos-latest
            name: macOS Universal
            artifact: WA-Tool-macOS-Universal
            arch: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          - os: ubuntu-latest
            name: Linux x64
            artifact: WA-Tool-Linux-x64
            arch: ''

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev

      - name: Configure
        shell: bash
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTOOL_COPY_PLUGIN_AFTER_BUILD=OFF
          -DTOOL_BUILD_TESTS=ON
          ${{ matrix.arch }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run DSP checks
        shell: bash
        run: |
          cmake --build build --config Release --target ToolTests
          bin=$(find build \( -name ToolTests -o -name ToolTests.exe \) -type f | head -n 1)
          test -n "$bin" || { echo "ToolTests binary not found"; exit 1; }
          if [ "$RUNNER_OS" = "Linux" ] && command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a "$bin"
          else
            "$bin"
          fi

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/Tool_artefacts/Release/VST3/*.vst3 dist/ 2>/dev/null || true
          cp -r build/Tool_artefacts/Release/Standalone/* dist/ 2>/dev/null || true
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Zip each platform
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            (cd "$dir" && zip -r -q "../${name}.zip" .)
          done
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          body: |
            ### Installation

            Copy the `.vst3` folder into your plugin directory:

            * Windows: `C:\Program Files\Common Files\VST3`
            * macOS: `~/Library/Audio/Plug-Ins/VST3`
            * Linux: `~/.vst3`

            Each archive also includes a standalone build, so you can try it without a DAW.
